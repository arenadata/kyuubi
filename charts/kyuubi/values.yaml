# Default values for kyuubi: a stateless Kyuubi server in a Deployment, one release per user
# or team. The server stands on its own: no ZooKeeper, no metadata store, no engines of its own.
# Engines are run by operators behind Services, which the servers watch; see
# extensions/server/kyuubi-kubernetes-plugin/README.md.

# One server per release. Sessions end with the pod that holds them whatever the count, and a
# team's load needs no sharing out: more replicas would only cost.
replicaCount: 1

# Minimum number of seconds for which a newly created kyuubi server
# should be ready without any of its container crashing for it to be considered available.
minReadySeconds: 10

# maximum number of revisions that will be maintained in the Deployment's revision history.
revisionHistoryLimit: 10

# How the Deployment replaces its pod. The new server is up before the old one goes: the old
# one's sessions still end, but their clients can reconnect at once instead of waiting for a JVM.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# How long a stopping server has to finish what its sessions are doing.
terminationGracePeriodSeconds: 60

# Keeps voluntary disruptions (node drains) from taking every server at once. Off by default:
# with one replica, maxUnavailable: 1 protects nothing and minAvailable: 1 blocks every drain.
podDisruptionBudget:
  enabled: false
  # minAvailable wins when set
  minAvailable: ~
  maxUnavailable: 1

# Optional additional annotations to add to Kyuubi server pods
podAnnotations: {}

# The image must carry the kyuubi-kubernetes-plugin jar in $KYUUBI_HOME/jars,
# and the stock apache/kyuubi image does not.
image:
  repository: apache/kyuubi
  pullPolicy: IfNotPresent
  tag: ~

imagePullSecrets: []

# ServiceAccount the servers read Services with
serviceAccount:
  # Specifies whether a ServiceAccount should be created
  create: true
  # Specifies ServiceAccount name to be used (created if `create: true`)
  name: ~
  # Annotations to add to the ServiceAccount
  annotations: {}

# priorityClass used for Kyuubi server pod
priorityClass:
  # Specifies whether a priorityClass should be created
  create: false
  # Specifies priorityClass name to be used (created if `create: true`)
  name: ~
  # half of system-cluster-critical by default
  value: 1000000000

# Role-based access control: a Role and a RoleBinding in every namespace of
# discovery.namespaces, granting get/list/watch on Services. Nothing else is needed.
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Rules added to every Role
  extraRules: []

# Where engines and clusters are declared: Services labelled with discovery.labelSelector,
# annotated under discovery.annotationPrefix. A port named `kyuubi` (or what the
# `<prefix>port-name` annotation says) is the engine.
discovery:
  # Namespaces to watch; the release's own when empty
  namespaces: []
  labelSelector: kyuubi/enabled=true
  annotationPrefix: kyuubi/

engine:
  # Engines run by operators are shared by everyone who may use their profile.
  # CONNECTION is always refused: its engine space names a connection, not a profile.
  shareLevel: SERVER

# Frontends. REST and Spark Connect are not offered: either brings back the metadata store.
server:
  # Thrift Binary protocol (HiveServer2 compatible)
  thriftBinary:
    enabled: true
    port: 10009
    service:
      type: ClusterIP
      port: "{{ .Values.server.thriftBinary.port }}"
      nodePort: ~
      annotations: {}
      # A session lives on one connection; with replicaCount > 1, balancing per connection
      # is enough. ClientIP pins a client to a server.
      # https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
      sessionAffinity: ~
      sessionAffinityConfig: {}
      #  sessionAffinityConfig:
      #    clientIP:
      #      timeoutSeconds: 10800

  # Thrift HTTP protocol (HiveServer2 compatible). Every request of a session must reach
  # the server that opened it, hence ClientIP when replicaCount > 1.
  thriftHttp:
    enabled: false
    port: 10010
    service:
      type: ClusterIP
      port: "{{ .Values.server.thriftHttp.port }}"
      nodePort: ~
      annotations: {}
      sessionAffinity: ClientIP
      sessionAffinityConfig: {}

  # MySQL compatible text protocol (experimental)
  mysql:
    enabled: false
    port: 3309
    service:
      type: ClusterIP
      port: "{{ .Values.server.mysql.port }}"
      nodePort: ~
      annotations: {}
      sessionAffinity: ~
      sessionAffinityConfig: {}

# Kyuubi configuration files
kyuubiConf:
  # $KYUUBI_CONF_DIR directory
  dir: /opt/kyuubi/conf
  # Appended to the kyuubi-defaults.conf the chart renders (templated). The chart owns
  # frontend protocols, kyuubi.ha.*, the session conf advisor and the watched namespaces;
  # setting them here fails the rendering.
  defaults: ~
  #defaults: |
  #  kyuubi.authentication=KERBEROS
  #  kyuubi.kinit.principal=kyuubi/_HOST@EXAMPLE.COM
  #  kyuubi.kinit.keytab=/opt/kyuubi/conf/kyuubi.keytab

  # Other configuration files from the specified keys (file name) and values (file content),
  # kept in the release's Secret with kyuubi-defaults.conf; kyuubi-defaults.conf is not one of them
  files: ~
  #files:
  #  'log4j2.xml': |
  #    ...

  # Configuration files from the list of existing ConfigMaps and Secrets
  filesFrom: []
  #filesFrom:
  #- secret:
  #    name: kyuubi-keytab
  #    items:
  #      - key: keytab
  #        path: kyuubi.keytab
  #- secret:
  #    name: ssl-secrets
  #    items:
  #      - key: key-store
  #        path: certs/keystore.jks

# Hadoop configuration files, for Kerberos and impersonation
hadoopConf:
  # $HADOOP_CONF_DIR directory
  dir: /opt/hadoop/conf
  # Configuration files from the specified keys (file name) and values (file content),
  # kept in the <release>-hadoop Secret
  files: ~
  #files:
  # 'core-site.xml': |
  #   <?xml version="1.0"?>
  #   <configuration>
  #     <property>
  #       <name>hadoop.security.authentication</name>
  #       <value>kerberos</value>
  #     </property>
  #   </configuration>

  # Configuration files from the list of existing ConfigMaps and Secrets
  filesFrom: []

# Command to launch Kyuubi server (templated)
command: ~
# Arguments to launch Kyuubi server (templated); `./bin/kyuubi run` unless set
args: ~

# JVM options of the server, KYUUBI_JAVA_OPTS (templated)
javaOpts: -XX:MaxRAMPercentage=75.0

# Environment variables (templated)
env: []
# Environment variables from ConfigMaps and Secrets (templated)
envFrom: []

# Additional volumes for Kyuubi pod (templated)
volumes: []
# Additional volumeMounts for Kyuubi container (templated)
volumeMounts: []

# Additional init containers for Kyuubi pod (templated)
initContainers: []
# Additional containers for Kyuubi pod (templated)
containers: []

# Resource requests and limits for Kyuubi pods. The server runs no engines,
# so it needs memory for sessions and operations only.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

# Probes knock on the first enabled frontend's port.
# Startup probe: the others wait for it
startupProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 60

# Liveness probe
livenessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6
  successThreshold: 1

# Readiness probe
readinessProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

# Constrain Kyuubi pods to nodes with specific node labels
nodeSelector: {}
# Allow to schedule Kyuubi pods on nodes with matching taints
tolerations: []
# Constrain Kyuubi pods to nodes by complex affinity/anti-affinity rules
affinity: {}
# Spread Kyuubi pods across nodes or zones (templated)
topologySpreadConstraints: []
#  topologySpreadConstraints:
#    - maxSkew: 1
#      topologyKey: kubernetes.io/hostname
#      whenUnsatisfiable: ScheduleAnyway
#      labelSelector:
#        matchLabels:
#          app.kubernetes.io/name: kyuubi
#          app.kubernetes.io/instance: "{{ .Release.Name }}"

# Kyuubi pods security context
securityContext: {}
# Kyuubi container security context
containerSecurityContext: {}

# Metrics configuration
metrics:
  # Enable metrics system, used for 'kyuubi.metrics.enabled' property
  enabled: true
  # A comma-separated list of metrics reporters, used for 'kyuubi.metrics.reporters' property
  reporters: PROMETHEUS
  # Prometheus port, used for 'kyuubi.metrics.prometheus.port' property
  prometheusPort: 10019

  # PodMonitor by Prometheus Operator
  podMonitor:
    # Enable PodMonitor creation
    enabled: false
    # List of pod endpoints serving metrics to be scraped by Prometheus, see Prometheus Operator docs for more details
    podMetricsEndpoints: []
    #  podMetricsEndpoints：
    #    - path: /metrics
    #      port: prometheus
    # Additional labels for PodMonitor to be discovered by Prometheus
    labels: {}

  # ServiceMonitor by Prometheus Operator, on the <release>-metrics Service
  serviceMonitor:
    # Enable ServiceMonitor creation
    enabled: false
    # List of service endpoints serving metrics to be scraped by Prometheus, see Prometheus Operator docs for more details
    endpoints: []
    #  endpoints:
    #    - port: prometheus
    # Additional labels to be used to make ServiceMonitor discovered by Prometheus
    labels: {}

  # PrometheusRule by Prometheus Operator
  prometheusRule:
    # Enable PrometheusRule creation
    enabled: false
    # Content of Prometheus rule file
    groups: []
    # Additional labels to be used to make PrometheusRule discovered by Prometheus
    labels: {}
