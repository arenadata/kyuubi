apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kyuubi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kyuubi.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kyuubi.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/conf: {{ include (print $.Template.BasePath "/kyuubi-secret.yaml") . | sha256sum }}
        checksum/conf-hadoop: {{ include (print $.Template.BasePath "/kyuubi-hadoop-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.name .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- end }}
      {{- if or .Values.priorityClass.name .Values.priorityClass.create }}
      priorityClassName: {{ .Values.priorityClass.name | default .Release.Name }}
      {{- end }}
      # A server holds only its own sessions: they end with it, and draining them is all the
      # grace a stop needs.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.initContainers }}
      initContainers: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: kyuubi-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command: {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args: {{- tpl (toYaml .) $ | nindent 12 }}
          {{- else }}
          args:
            - ./bin/kyuubi
            - run
          {{- end }}
          env:
            - name: KYUUBI_CONF_DIR
              value: {{ .Values.kyuubiConf.dir }}
            - name: HADOOP_CONF_DIR
              value: {{ .Values.hadoopConf.dir }}
            {{- with .Values.javaOpts }}
            - name: KYUUBI_JAVA_OPTS
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.env }}
              {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom: {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          ports:
            {{- range $name, $frontend := .Values.server }}
            {{- if $frontend.enabled }}
            - name: {{ $name | kebabcase }}
              containerPort: {{ $frontend.port }}
            {{- end }}
            {{- end }}
            {{- if include "kyuubi.prometheus.enabled" . }}
            - name: prometheus
              containerPort: {{ .Values.metrics.prometheusPort }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: {{ include "kyuubi.probePort" . }}
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ include "kyuubi.probePort" . }}
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ include "kyuubi.probePort" . }}
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: conf
              mountPath: {{ .Values.kyuubiConf.dir }}
            - name: conf-hadoop
              mountPath: {{ .Values.hadoopConf.dir }}
            {{- with .Values.volumeMounts }}
              {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- with .Values.containers }}
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: conf
          projected:
            sources:
              - secret:
                  name: {{ .Release.Name }}
              {{- with .Values.kyuubiConf.filesFrom }}
                {{- tpl (toYaml .) $ | nindent 14 }}
              {{- end }}
        - name: conf-hadoop
          projected:
            sources:
              - secret:
                  name: {{ .Release.Name }}-hadoop
              {{- with .Values.hadoopConf.filesFrom }}
                {{- tpl (toYaml .) $ | nindent 14 }}
              {{- end }}
        {{- with .Values.volumes }}
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
