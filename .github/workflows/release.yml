name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify tag is on release branch
      run: |
        BRANCHES=$(git branch -r --contains ${{ github.sha }} | grep 'origin/release/' || true)
        if [ -z "$BRANCHES" ]; then
          echo "Tag must be on a release/** branch. Found on:"
          git branch -r --contains ${{ github.sha }}
          exit 1
        fi
        echo "Tag is on: $BRANCHES"

    - name: Verify CI passed
      run: |
        CONCLUSION=$(gh run list --commit ${{ github.sha }} --workflow CI --json conclusion -q '.[0].conclusion')
        if [ -z "$CONCLUSION" ]; then
          echo "No CI run found for this commit. Push to release/** branch first."
          exit 1
        fi
        if [ "$CONCLUSION" != "success" ]; then
          echo "CI has not passed for this commit (status: $CONCLUSION)"
          exit 1
        fi
        echo "CI passed"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - uses: ./.github/actions/setup-maven
      with:
        java-version: 21

    - name: Build and Deploy to GitHub Packages
      run: >-
        build/mvn -B -V -ntp deploy
        -Pjdbc-shaded -Pscala-2.13 -Pspark-3.5 -Pzookeeper-3.9 -Pweb-ui -Pspark-provided,flink-provided,hive-provided
        -DskipTests -Drat.skip=true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The build above is Spark 3.5 only. The authz extension is Spark-version
    # specific and its artifactId carries ${spark.artifact.version}, so a second,
    # module-scoped build publishes the Spark 4 flavour under distinct
    # coordinates. Non-Spark modules it depends on are already in the local
    # repository from the step above, hence no -am.
    - name: Build and Deploy Spark 4 Authz to GitHub Packages
      run: >-
        build/mvn -B -V -ntp clean deploy
        -pl extensions/spark/kyuubi-spark-authz,extensions/spark/kyuubi-spark-authz-shaded
        -Pscala-2.13 -Pspark-4.2 -Pzookeeper-3.9 -Pspark-provided,flink-provided,hive-provided
        -DskipTests -Drat.skip=true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate SBOM
      run: >-
        build/mvn -B -ntp
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
        -Pjdbc-shaded -Pscala-2.13 -Pspark-3.5 -Pzookeeper-3.9 -Pweb-ui
        -DoutputFormat=json -DoutputName=bom
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The BOM above covers the Spark 3.5 reactor. The Spark 4 authz artifacts are
    # built from a separate reactor, so they need their own BOM. `outputDirectory`
    # is pinned because the aggregate goal otherwise writes into the first module
    # of the reactor rather than the workspace root.
    - name: Generate SBOM for Spark 4 Authz
      run: >-
        build/mvn -B -ntp
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
        -pl extensions/spark/kyuubi-spark-authz,extensions/spark/kyuubi-spark-authz-shaded
        -Pscala-2.13 -Pspark-4.2 -Pzookeeper-3.9
        -DoutputFormat=json -DoutputName=bom-spark-4-authz
        -DoutputDirectory=${{ github.workspace }}/target
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Vulnerability scan (grype)
      uses: anchore/scan-action@v6
      with:
        sbom: target/bom.json
        fail-build: false
        output-format: json
        output-file: vulnerability-report.json

    - name: Vulnerability scan for Spark 4 Authz (grype)
      uses: anchore/scan-action@v6
      with:
        sbom: target/bom-spark-4-authz.json
        fail-build: false
        output-format: json
        output-file: vulnerability-report-spark-4-authz.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          target/bom.json
          target/bom-spark-4-authz.json
          vulnerability-report.json
          vulnerability-report-spark-4-authz.json
