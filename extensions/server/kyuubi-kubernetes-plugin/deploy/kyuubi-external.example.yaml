# Example, not applied by setup.sh: an address of its own for every Kyuubi pod, for clients
# outside the cluster. Needs the Kyuubi workload to be a StatefulSet named "kyuubi" (pod names
# kyuubi-0, kyuubi-1, ...); the Deployment in kyuubi.yaml gives pods no stable names.
#
#   jdbc:hive2://<node-1>:30009,<node-2>:30010/;serviceDiscoveryMode=list
#
# With type: LoadBalancer, put the addresses the load balancers get in the URL instead.
apiVersion: v1
kind: Service
metadata:
  name: kyuubi-0-external
  namespace: kyuubi-stand
spec:
  type: NodePort
  # keep the client on the node the pod runs on; no second hop through kube-proxy
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: kyuubi-0
  ports:
    - name: thrift
      port: 10009
      targetPort: thrift
      nodePort: 30009
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi-1-external
  namespace: kyuubi-stand
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: kyuubi-1
  ports:
    - name: thrift
      port: 10009
      targetPort: thrift
      nodePort: 30010
