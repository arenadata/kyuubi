# The clusters Kyuubi sends sessions to, declared on their Services and nowhere else.
apiVersion: v1
kind: Namespace
metadata:
  name: kyuubi-stand
---
# Trino, one node, no authentication.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino
  namespace: kyuubi-stand
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
  jvm.config: |
    -server
    -XX:InitialRAMPercentage=25
    -XX:MaxRAMPercentage=65
    -XX:G1HeapRegionSize=16M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError
    -XX:ReservedCodeCacheSize=96M
    -Djdk.attach.allowAttachSelf=true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: kyuubi-stand
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
    spec:
      containers:
        - name: trino
          image: localhost:5001/trinodb/trino:483
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1280Mi
          volumeMounts:
            - name: config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
      volumes:
        - name: config
          configMap:
            name: trino
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: kyuubi-stand
  labels:
    kyuubi/enabled: "true"
  annotations:
    # An engine profile, as kyuubi.engine.profile.trino.* would declare it. The
    # connection url is the Service's own, filled in by the plugin.
    kyuubi/type: TRINO
    kyuubi/session.engine.trino.connection.catalog: tpch
    kyuubi/default: "true"
spec:
  selector:
    app.kubernetes.io/name: trino
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# PostgreSQL through the JDBC engine: the same path an Impala cluster takes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
  namespace: kyuubi-stand
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse
    spec:
      containers:
        - name: postgres
          image: localhost:5001/postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: stand-only-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
  namespace: kyuubi-stand
  labels:
    kyuubi/enabled: "true"
  annotations:
    kyuubi/type: JDBC
    kyuubi/conf.kyuubi.engine.jdbc.type: postgresql
    kyuubi/conf.kyuubi.engine.jdbc.driver.class: org.postgresql.Driver
    kyuubi/conf.kyuubi.engine.jdbc.connection.url: "jdbc:postgresql://{host}:{port}/postgres"
    kyuubi/conf.kyuubi.engine.jdbc.connection.user: postgres
    # A stand only: a real cluster's password does not belong in an annotation.
    kyuubi/conf.kyuubi.engine.jdbc.connection.password: stand-only-password
spec:
  selector:
    app.kubernetes.io/name: warehouse
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
