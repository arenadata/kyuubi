# The engines, started the way an operator would start them: workloads of their own, kept up
# between sessions and registered nowhere. Each one's Service declares the engine profile it
# serves, and its port named "kyuubi" is where Kyuubi connects a session of that profile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-engine
  namespace: kyuubi-stand
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino-engine
    spec:
      containers:
        - name: engine
          image: localhost:5001/kyuubi-stateless:dev
          imagePullPolicy: Always
          command:
            - java
            - -Xmx256m
            - -cp
            - /opt/kyuubi/externals/engines/trino/*
            - org.apache.kyuubi.engine.trino.TrinoSqlEngine
            - --conf
            - kyuubi.frontend.thrift.binary.bind.host=0.0.0.0
            - --conf
            - kyuubi.frontend.thrift.binary.bind.port=10009
            - --conf
            - kyuubi.session.engine.trino.connection.url=http://trino.kyuubi-stand.svc:8080
            - --conf
            - kyuubi.session.engine.trino.connection.catalog=tpch
            - --conf
            - kyuubi.engine.share.level=SERVER
            - --conf
            - kyuubi.session.user=kyuubi
            # Kept up between sessions: zero turns the idle timeout off.
            - --conf
            - kyuubi.session.engine.idle.timeout=PT0S
          ports:
            - name: kyuubi
              containerPort: 10009
          readinessProbe:
            tcpSocket:
              port: kyuubi
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trino-engine
  namespace: kyuubi-stand
  labels:
    kyuubi/enabled: "true"
  annotations:
    kyuubi/profile: trino
    kyuubi/type: TRINO
    kyuubi/session.engine.trino.connection.catalog: tpch
    kyuubi/default: "true"
spec:
  selector:
    app.kubernetes.io/name: trino-engine
  ports:
    - name: kyuubi
      port: 10009
      targetPort: kyuubi
---
# PostgreSQL through the JDBC engine: the same path an Impala cluster takes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-engine
  namespace: kyuubi-stand
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-engine
    spec:
      containers:
        - name: engine
          image: localhost:5001/kyuubi-stateless:dev
          imagePullPolicy: Always
          command:
            - java
            - -Xmx256m
            - -cp
            - /opt/kyuubi/externals/engines/jdbc/*:/opt/kyuubi/drivers/*
            - org.apache.kyuubi.engine.jdbc.JdbcSQLEngine
            - --conf
            - kyuubi.frontend.thrift.binary.bind.host=0.0.0.0
            - --conf
            - kyuubi.frontend.thrift.binary.bind.port=10009
            - --conf
            - kyuubi.engine.jdbc.type=postgresql
            - --conf
            - kyuubi.engine.jdbc.driver.class=org.postgresql.Driver
            - --conf
            - kyuubi.engine.jdbc.connection.url=jdbc:postgresql://warehouse.kyuubi-stand.svc:5432/postgres
            - --conf
            - kyuubi.engine.jdbc.connection.user=postgres
            # A stand only: a real password comes from a Secret.
            - --conf
            - kyuubi.engine.jdbc.connection.password=stand-only-password
            - --conf
            - kyuubi.engine.share.level=SERVER
            - --conf
            - kyuubi.session.user=kyuubi
            - --conf
            - kyuubi.session.engine.idle.timeout=PT0S
          ports:
            - name: kyuubi
              containerPort: 10009
          readinessProbe:
            tcpSocket:
              port: kyuubi
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-engine
  namespace: kyuubi-stand
  labels:
    kyuubi/enabled: "true"
  annotations:
    kyuubi/profile: warehouse
    kyuubi/type: JDBC
    # The engine's port keeps its own name; this says which one it is.
    kyuubi/port-name: thrift
spec:
  selector:
    app.kubernetes.io/name: warehouse-engine
  ports:
    - name: thrift
      port: 10009
      targetPort: kyuubi
---
# A profile whose engine nobody runs: sessions asking for it are refused, and Kyuubi starts nothing.
apiVersion: v1
kind: Service
metadata:
  name: impala
  namespace: kyuubi-stand
  labels:
    kyuubi/enabled: "true"
  annotations:
    kyuubi/type: JDBC
spec:
  ports:
    - name: hs2
      port: 21050
