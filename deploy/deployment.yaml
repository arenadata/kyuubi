#
# The gateway itself.
#
# The configuration it reads is not here: it is one Secret named
# kyuubi-routing-gateway, and there are two mutually exclusive versions of it -
# config.yaml without Kerberos, kerberos-gateway.yaml with. Apply one. Keeping
# them out of this file is what stops re-applying the Deployment from quietly
# putting the other one back.
#
# One replica here. More than one is supported, but only with
# kyuubi.gateway.admission.shared on - otherwise each replica admits against its
# own ledger and together they overcommit every cluster.
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyuubi-routing-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: kyuubi-routing-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyuubi-routing-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyuubi-routing-gateway
    spec:
      serviceAccountName: kyuubi-routing-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: localhost:5001/kyuubi-routing-gateway:latest
          imagePullPolicy: Always
          env:
            # Where Kyuubi looks for kyuubi-defaults.conf. Command-line --conf
            # flags still win over the file, which is what makes a one-off
            # override possible without editing the Secret.
            - name: KYUUBI_CONF_DIR
              value: /etc/kyuubi
            # Two variables for one file, because two different things read it.
            # KRB5_CONFIG is the MIT C library's, honoured by any krb5 tool a
            # child process might be; the JVM ignores it entirely and reads the
            # java.security.krb5.conf property instead - without which the login
            # fails with "KrbException: Cannot locate default realm" while the
            # file sits mounted and correct.
            #
            # Harmless with authentication off: nothing parses the file then.
            # Set here so turning Kerberos on needs no change to the Deployment,
            # only to the Secrets it mounts.
            - name: KRB5_CONFIG
              value: /etc/kyuubi/krb5/krb5.conf
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.security.krb5.conf=/etc/kyuubi/krb5/krb5.conf
          ports:
            - name: hs2-binary
              containerPort: 10009
            - name: hs2-http
              containerPort: 10010
            - name: metrics
              containerPort: 10019
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          # Readiness on the hs2-binary port itself: the metrics service is
          # registered first in RoutingGateway.initialize() and so starts
          # before the backend service and the frontends do (CompositeService
          # starts children in registration order) - /metrics can answer while
          # the cluster resolver is still doing its first refresh, Kerberos is
          # still logging in, or the thrift ports have not opened yet. A raw
          # TCP check can in principle pass on a socket that accepts and then
          # fails every session, but that is narrower than what it replaces:
          # traffic routed to a pod not listening on hs2-binary at all.
          readinessProbe:
            tcpSocket:
              port: hs2-binary
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness stays on metrics: it only has to tell whether the process
          # is wedged, not whether it is ready for traffic, and a lightweight
          # HTTP check that does not depend on session-handling capacity is
          # the safer thing to fail a restart on.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/kyuubi
              readOnly: true
            # Both are optional, so this Deployment runs with or without a
            # realm behind it. Kerberos is then a matter of applying
            # kerberos.yaml, running kerberos-keytab.sh and rolling the pods.
            - name: krb5
              mountPath: /etc/kyuubi/krb5
              readOnly: true
            - name: keytab
              mountPath: /etc/kyuubi/keytab
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: kyuubi-routing-gateway
            # Readable by the gateway's own uid and nobody else in the pod.
            defaultMode: 0400
        - name: krb5
          secret:
            secretName: kyuubi-routing-gateway-krb5
            defaultMode: 0444
            optional: true
        - name: keytab
          secret:
            secretName: kyuubi-routing-gateway-keytab
            # A keytab is a credential: readable by the gateway and nothing
            # else, which is also what Hadoop's login checks for.
            defaultMode: 0400
            optional: true
        # The root filesystem is read-only, and the JVM still wants somewhere to
        # write - hsperfdata, and any heap dump worth having.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi-routing-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: kyuubi-routing-gateway
spec:
  selector:
    app.kubernetes.io/name: kyuubi-routing-gateway
  ports:
    - name: hs2-binary
      port: 10009
      targetPort: hs2-binary
    - name: hs2-http
      port: 10010
      targetPort: hs2-http
    - name: metrics
      port: 10019
      targetPort: metrics
