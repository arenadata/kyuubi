#
# The gateway itself.
#
# One replica here. More than one is supported, but only with
# kyuubi.gateway.admission.shared on - otherwise each replica admits against its
# own ledger and together they overcommit every cluster.
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyuubi-routing-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: kyuubi-routing-gateway
data:
  # The gateway reads this once, at startup. An edit here needs
  # `kubectl rollout restart deploy/kyuubi-routing-gateway -n gateway`;
  # nothing reloads it on its own, and a ConfigMap change is invisible to the
  # Deployment.
  kyuubi-defaults.conf: |
    # Frontends. Binary HS2 is the one every client speaks; the HTTP transport is
    # there for clients that cannot open a raw socket through a proxy.
    kyuubi.frontend.protocols                     THRIFT_BINARY,THRIFT_HTTP
    kyuubi.frontend.thrift.binary.bind.host       0.0.0.0
    kyuubi.frontend.thrift.binary.bind.port       10009
    kyuubi.frontend.thrift.http.bind.host         0.0.0.0
    kyuubi.frontend.thrift.http.bind.port         10010

    # Discovery: Services in this namespace carrying the label, read every 10s.
    kyuubi.gateway.engine                         trino
    kyuubi.gateway.cluster.resolver               kubernetes
    kyuubi.gateway.kubernetes.namespace           gateway
    kyuubi.gateway.kubernetes.labelSelector       kyuubi.gateway/enabled=true
    kyuubi.gateway.kubernetes.pollInterval        10000

    # Metrics on their own port, so the gateway can be scraped without exposing
    # anything else. No admin REST: there is nothing here to administer remotely.
    kyuubi.metrics.enabled                        true
    kyuubi.metrics.reporters                      PROMETHEUS
    kyuubi.metrics.prometheus.port                10019
    kyuubi.metrics.prometheus.path                /metrics

    # Admission, scaling and the shared ledger are off: each changes what
    # clients see or writes to Kubernetes, and each should be turned on
    # deliberately. See the module README for what they need.
    kyuubi.gateway.admission.enabled              false
    kyuubi.gateway.scaling.enabled                false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyuubi-routing-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: kyuubi-routing-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyuubi-routing-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyuubi-routing-gateway
    spec:
      serviceAccountName: kyuubi-routing-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: localhost:5001/kyuubi-routing-gateway:latest
          imagePullPolicy: Always
          env:
            # Where Kyuubi looks for kyuubi-defaults.conf. Command-line --conf
            # flags still win over the file, which is what makes a one-off
            # override possible without editing the ConfigMap.
            - name: KYUUBI_CONF_DIR
              value: /etc/kyuubi
          ports:
            - name: hs2-binary
              containerPort: 10009
            - name: hs2-http
              containerPort: 10010
            - name: metrics
              containerPort: 10019
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          # Readiness on the metrics port rather than the thrift one: a TCP
          # check against HS2 would pass on a socket that accepts and then
          # fails every session, whereas the metrics endpoint only answers once
          # the services behind it have started.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/kyuubi
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kyuubi-routing-gateway
        # The root filesystem is read-only, and the JVM still wants somewhere to
        # write - hsperfdata, and any heap dump worth having.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi-routing-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: kyuubi-routing-gateway
spec:
  selector:
    app.kubernetes.io/name: kyuubi-routing-gateway
  ports:
    - name: hs2-binary
      port: 10009
      targetPort: hs2-binary
    - name: hs2-http
      port: 10010
      targetPort: hs2-http
    - name: metrics
      port: 10019
      targetPort: metrics
