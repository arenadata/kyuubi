name: kyuubi-system-tests

x-spark3: &spark3
  build:
    context: ./docker
    dockerfile: Dockerfile.spark3-scala213
  image: ${SPARK3_IMAGE:-local/spark:3.5.5-scala2.13}
  user: root
  environment: &spark3-env
    SPARK_NO_DAEMONIZE: "1"
    HADOOP_CONF_DIR: /etc/hadoop/conf
  volumes: &spark3-vols
    - ./conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    - ./conf/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
    - ./conf/spark3/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro

x-spark4: &spark4
  image: ${SPARK4_IMAGE}
  user: root
  environment: &spark4-env
    SPARK_NO_DAEMONIZE: "1"
    HADOOP_CONF_DIR: /etc/hadoop/conf
  volumes: &spark4-vols
    - ./conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    - ./conf/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
    - ./conf/spark4/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    - ./conf/core-site.xml:/opt/spark/conf/core-site.xml:ro

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    environment:
      CLUSTER_NAME: kyuubi-st
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      # Allow Kyuubi (root) to impersonate JDBC session users (e.g. anonymous) for HIVE_SQL
      CORE_CONF_hadoop_proxyuser_root_hosts: "*"
      CORE_CONF_hadoop_proxyuser_root_groups: "*"
      CORE_CONF_hadoop_proxyuser_kyuubi_hosts: "*"
      CORE_CONF_hadoop_proxyuser_kyuubi_groups: "*"
      CORE_CONF_hadoop_proxyuser_hive_hosts: "*"
      CORE_CONF_hadoop_proxyuser_hive_groups: "*"
    ports:
      - "9870:9870"
    volumes:
      - namenode:/hadoop/dfs/name
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "hdfs dfsadmin -safemode get 2>/dev/null | grep -q 'Safe mode is OFF'",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      CORE_CONF_hadoop_proxyuser_root_hosts: "*"
      CORE_CONF_hadoop_proxyuser_root_groups: "*"
      SERVICE_PRECONDITION: "namenode:9870"
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode:/hadoop/dfs/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  postgres-metastore:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres-metastore
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
      POSTGRES_HOST_AUTH_METHOD: md5 # hive jdbc has md5 new postgres has SCRAM
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    command: ["postgres", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-app:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres-app
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5434:5432"
    volumes:
      - ./scripts/init-app-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: zookeeper:${ZOOKEEPER_VERSION}
    hostname: zookeeper
    environment:
      ZOO_MY_ID: 1
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  hive-metastore:
    image: ${HIVE_IMAGE}
    hostname: hive-metastore
    user: root
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    ports:
      - "9083:9083"
    depends_on:
      postgres-metastore:
        condition: service_healthy
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9083'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  trino:
    image: trinodb/trino:${TRINO_VERSION}
    hostname: trino
    ports:
      - "8080:8080"
    volumes:
      - ./conf/trino/config.properties:/etc/trino/config.properties:ro
      - ./conf/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./conf/trino/node.properties:/etc/trino/node.properties:ro
      - ./conf/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
      - ./conf/core-site.xml:/etc/trino/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/etc/trino/hadoop/hdfs-site.xml:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  hdfs-ready:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: hdfs-ready
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes:
      - ./scripts/hdfs-ready.sh:/hdfs-ready.sh:ro
    entrypoint: ["/bin/bash", "/hdfs-ready.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "hdfs dfs -fs hdfs://namenode:8020 -test -d /tmp/hive && hdfs dfs -fs hdfs://namenode:8020 -test -d /user/hive/warehouse",
        ]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s

  # Spark 3 Standalone (image built from Dockerfile.spark3-scala213)
  spark3-master:
    <<: *spark3
    hostname: spark3-master
    environment:
      <<: *spark3-env
      SPARK_MASTER_HOST: spark3-master
    ports:
      - "7077:7077"
      - "8081:8080"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark3-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    volumes: *spark3-vols
    depends_on:
      hdfs-ready:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  spark3-worker:
    <<: *spark3
    hostname: spark3-worker
    environment:
      <<: *spark3-env
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - "2g"
      - spark://spark3-master:7077
    volumes: *spark3-vols
    depends_on:
      spark3-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f org.apache.spark.deploy.worker.Worker >/dev/null'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Spark 4 Standalone
  spark4-master:
    <<: *spark4
    hostname: spark4-master
    environment:
      <<: *spark4-env
      SPARK_MASTER_HOST: spark4-master
    ports:
      - "7078:7077"
      - "8082:8080"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark4-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    volumes: *spark4-vols
    depends_on:
      hdfs-ready:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  spark4-worker:
    <<: *spark4
    hostname: spark4-worker
    environment:
      <<: *spark4-env
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - "2g"
      - spark://spark4-master:7077
    volumes: *spark4-vols
    depends_on:
      spark4-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f org.apache.spark.deploy.worker.Worker >/dev/null'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  kyuubi:
    build:
      context: ./docker
      dockerfile: Dockerfile.kyuubi
      args:
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
        MAVEN_CENTRAL: ${MAVEN_CENTRAL}
        BASE_IMAGE: ${KYUUBI_BASE_IMAGE}
        SPARK4_IMAGE: ${SPARK4_IMAGE}
        HIVE_HOME_IMAGE: ${HIVE_HOME_IMAGE}
    image: kyuubi-st-kyuubi:${KYUUBI_IMAGE_TAG}
    hostname: kyuubi
    ports:
      - "10009:10009"
      - "10099:10099"
      - "4040-4045:4040-4045"
    volumes:
      - ./runtime/kyuubi-defaults.conf:/opt/kyuubi/conf/kyuubi-defaults.conf
      - ./conf/kyuubi-env.sh:/opt/kyuubi/conf/kyuubi-env.sh:ro
      - ./conf/log4j2.xml:/opt/kyuubi/conf/log4j2.xml:ro
      - ./conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
      - ./conf/hive-site.xml:/etc/hive/conf/hive-site.xml:ro
      - ./conf/spark3/spark-defaults.conf:/etc/spark3/conf/spark-defaults.conf:ro
      - ./conf/spark4/spark-defaults.conf:/etc/spark4/conf/spark-defaults.conf:ro
      - ./conf/hive-site.xml:/etc/spark3/conf/hive-site.xml:ro
      - ./conf/hive-site.xml:/etc/spark4/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/etc/spark3/conf/core-site.xml:ro
      - ./conf/core-site.xml:/etc/spark4/conf/core-site.xml:ro
    environment:
      HADOOP_CONF_DIR: /etc/hadoop/conf
      HIVE_CONF_DIR: /etc/hive/conf
    depends_on:
      zookeeper:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      trino:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      hdfs-ready:
        condition: service_healthy
      spark3-master:
        condition: service_healthy
      spark3-worker:
        condition: service_healthy
      spark4-master:
        condition: service_healthy
      spark4-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10009'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  namenode:
  datanode:
