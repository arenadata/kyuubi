## Frontend
kyuubi.authentication=NONE
kyuubi.frontend.bind.host=0.0.0.0
kyuubi.frontend.protocols=THRIFT_BINARY,REST
kyuubi.frontend.thrift.binary.bind.port=10009
kyuubi.frontend.rest.bind.port=10099

## HA / discovery (required for engine-profile UI grouping)
kyuubi.ha.addresses=zookeeper:2181
kyuubi.ha.namespace=kyuubi_system_tests

## Session defaults
kyuubi.engine.share.level=CONNECTION
kyuubi.session.engine.idle.timeout=PT10M
kyuubi.engine.type=SPARK_SQL

## ---------------------------------------------------------------------------
## Engine profiles (ADH-8475) — separate compute services
## Buckets: type | env.* | session.* | conf.*
## ---------------------------------------------------------------------------

# Spark 3 → Standalone cluster spark3-master:7077 → HDFS
kyuubi.engine.profile.spark3.type=SPARK_SQL
kyuubi.engine.profile.spark3.env.SPARK_HOME=/usr/lib/spark3
kyuubi.engine.profile.spark3.env.SPARK_CONF_DIR=/etc/spark3/conf
kyuubi.engine.profile.spark3.env.HADOOP_CONF_DIR=/etc/hadoop/conf
kyuubi.engine.profile.spark3.conf.spark.master=spark://spark3-master:7077
kyuubi.engine.profile.spark3.conf.spark.submit.deployMode=client
kyuubi.engine.profile.spark3.conf.spark.driver.host=kyuubi
kyuubi.engine.profile.spark3.conf.spark.driver.bindAddress=0.0.0.0
kyuubi.engine.profile.spark3.conf.spark.ui.port=4040

# Spark 4 → Standalone cluster spark4-master:7077 → HDFS
kyuubi.engine.profile.spark4.type=SPARK_SQL
kyuubi.engine.profile.spark4.env.SPARK_HOME=/usr/lib/spark4
kyuubi.engine.profile.spark4.env.SPARK_CONF_DIR=/etc/spark4/conf
kyuubi.engine.profile.spark4.env.HADOOP_CONF_DIR=/etc/hadoop/conf
kyuubi.engine.profile.spark4.conf.spark.master=spark://spark4-master:7077
kyuubi.engine.profile.spark4.conf.spark.submit.deployMode=client
kyuubi.engine.profile.spark4.conf.spark.driver.host=kyuubi
kyuubi.engine.profile.spark4.conf.spark.driver.bindAddress=0.0.0.0
kyuubi.engine.profile.spark4.conf.spark.ui.port=4041

# Trino → Hive catalog → HDFS
kyuubi.engine.profile.trino.type=TRINO
kyuubi.engine.profile.trino.session.engine.trino.connection.url=http://trino:8080
kyuubi.engine.profile.trino.session.engine.trino.connection.catalog=hive

# Hive SQL → HMS → HDFS (engine forked on Kyuubi using mounted HIVE_HOME)
# HIVE_HADOOP_CLASSPATH: prod dist has no externals/engines/hive/scala-*/jars; reuse
# hadoop-client jars shipped next to the JDBC engine (stable symlinks from image build).
kyuubi.engine.profile.hive.type=HIVE_SQL
kyuubi.engine.profile.hive.env.HIVE_HOME=/usr/lib/hive
kyuubi.engine.profile.hive.env.HADOOP_CONF_DIR=/etc/hadoop/conf
kyuubi.engine.profile.hive.env.HIVE_CONF_DIR=/etc/hive/conf
kyuubi.engine.profile.hive.env.HIVE_HADOOP_CLASSPATH=/opt/kyuubi/externals/engines/jdbc/hadoop-client-api.jar:/opt/kyuubi/externals/engines/jdbc/hadoop-client-runtime.jar

# JDBC → Postgres (app DB)
# JDBC keys are kyuubi.engine.jdbc.* (not session.engine.jdbc.*) — use conf.* bucket.
kyuubi.engine.profile.postgres.type=JDBC
kyuubi.engine.profile.postgres.conf.kyuubi.engine.jdbc.connection.provider=postgresql
kyuubi.engine.profile.postgres.conf.kyuubi.engine.jdbc.connection.url=jdbc:postgresql://postgres-app:5432/app
kyuubi.engine.profile.postgres.conf.kyuubi.engine.jdbc.connection.user=app
kyuubi.engine.profile.postgres.conf.kyuubi.engine.jdbc.connection.password=app
kyuubi.engine.profile.postgres.conf.kyuubi.engine.jdbc.driver.class=org.postgresql.Driver
kyuubi.engine.profile.postgres.conf.kyuubi.engine.jdbc.extra.classpath=/opt/jdbc-drivers/postgresql.jar

## Per-engine-type defaults (real key: profile.default)
kyuubi.engine.SPARK_SQL.profile.default=spark3
kyuubi.engine.TRINO.profile.default=trino
kyuubi.engine.HIVE_SQL.profile.default=hive
kyuubi.engine.JDBC.profile.default=postgres

## Unknown profile strategy (default FAIL)
kyuubi.engine.profiles.unknown.strategy=FAIL

## Admin for REST engine-profile API
kyuubi.server.administrators=kyuubi,anonymous,root
